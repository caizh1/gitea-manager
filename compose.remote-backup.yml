    sysctls: {net.ipv4.ip_forward: "1"}
  host-a:
    image: ${REMOTE_LAB_HOST_IMAGE:?请先执行 deploy}
    privileged: true
    environment: {DOCKER_TLS_CERTDIR: ""}
  host-b:
    image: ${REMOTE_LAB_HOST_IMAGE:?请先执行 deploy}
