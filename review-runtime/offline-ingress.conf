# Docker Desktop 不转发仅连接 internal 网络的端口；仅测试入口代理连接外侧。
# 固定反向代理目标，无 CONNECT 或任意 URL 转发，AI 执行器仍只有隔离网络。
events { worker_connections 128; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server { listen 3000; location / { set $target http://gitea:3000; proxy_pass $target$request_uri; proxy_set_header Host $http_host; } }
    server { listen 8080; location / { set $target http://frontend:80; proxy_pass $target$request_uri; proxy_set_header Host $http_host; } }
    server { listen 5053; location / { set $target http://review-model-fixture:5053; proxy_pass $target$request_uri; } }
}
