version: '3.8'

services:
  svn-migration-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.svn
    environment:
      DATABASE_URL: sqlite:////app/data/gitea-manager.db
      GM_UPGRADE_MAINTENANCE_FILE: /app/data/.svn-upgrade-maintenance
      PYTHONDONTWRITEBYTECODE: '1'
    volumes: [./data:/app/data]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
  backend:
    build: ./backend
    container_name: gitea-manager-api
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/home/appuser/.ssh/id_rsa:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GM_SVN_MAINTENANCE_FILE=/app/data/.svn-upgrade-maintenance
      - DATABASE_URL=sqlite:////app/data/gitea-manager.db
      - BACKUP_DIR=/app/data/backups
      - SECRET_KEY=${SECRET_KEY:-}
      - INIT_PASSWORD=${INIT_PASSWORD:?请运行 bash deploy.sh 生成初始凭据}
      - SSH_KEY_PATH=/home/appuser/.ssh/id_rsa
      - RESTORE_LONG_JOB_TIMEOUT_SECONDS=${RESTORE_LONG_JOB_TIMEOUT_SECONDS:-7200}
      - RESTORE_JOB_POLL_SECONDS=${RESTORE_JOB_POLL_SECONDS:-5}
      - RESTORE_SSH_RECONNECT_GRACE_SECONDS=${RESTORE_SSH_RECONNECT_GRACE_SECONDS:-300}
      - RESTORE_DIAGNOSTIC_INTERVAL_SECONDS=${RESTORE_DIAGNOSTIC_INTERVAL_SECONDS:-30}
      - INTEGRATION_ENABLED=${INTEGRATION_ENABLED:-false}
      - INTEGRATION_SERVICE_TOKEN=${INTEGRATION_SERVICE_TOKEN:-}
    restart: unless-stopped

  approval-view:
    build: ./backend
    command: [gunicorn, --bind, '0.0.0.0:5000', --workers, '2', --threads, '8', --timeout, '30', 'approval.view_app:create_app()']
    environment:
      DATABASE_URL: sqlite:////app/data/gitea-manager.db
      SSH_KEY_PATH: /home/appuser/.ssh/id_rsa
    volumes:
      - ./data:/app/data
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/home/appuser/.ssh/id_rsa:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [backend]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gitea-manager-ui
    ports:
      - "5480:80"
    depends_on:
      - backend
    restart: unless-stopped
