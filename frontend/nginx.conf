server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/approval-view/ {
        # 展示使用独立工作进程，避免页面突发占满审批门禁与 Manager 管理接口。
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $approval_display http://approval-view:5000;
        proxy_pass $approval_display$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
    }

    location /api/ {
        # 后端重建后容器 IP 可能变化，不能一直使用 nginx 启动时解析的旧地址。
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $manager_backend http://backend:5000;
        proxy_pass $manager_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
